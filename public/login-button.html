<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Door Animation Buttons — Log In & Log Out</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090a0f;
      color: #f1f5f9;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Showcase Grid: Dark & Light theme presentation */
    .showcase-container {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: stretch;
    }

    @media (max-width: 768px) {
      .showcase-container {
        grid-template-columns: 1fr;
      }
    }

    .theme-card {
      border-radius: 20px;
      padding: 2.5rem 2rem 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .theme-card--dark {
      background: #131620;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .theme-card--light {
      background: #f4f7ff;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    .card-label {
      position: absolute;
      top: 18px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
      pointer-events: none;
    }
    .theme-card--dark .card-label { color: #f4f7ff; }
    .theme-card--light .card-label { color: #1e2230; }

    /* Button Slot (Provides safe drop area for falling stickman) */
    .button-slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: visible;
      padding-bottom: 2rem;
    }

    /* ─── Animated Door Button ─── */
    .door-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      min-width: 176px;
      height: 52px;
      padding: 0 18px 0 24px;
      border-radius: 10px;
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      font-family: inherit;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.01em;
      overflow: visible;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .door-btn:active {
      transform: scale(0.97);
    }

    /* Dark Theme Button Variant */
    .door-btn--dark {
      background: #1e2230;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .door-btn--dark:hover {
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    /* Light Theme Button Variant */
    .door-btn--light {
      background: #ffffff;
      color: #1e2230;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.1), 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .door-btn--light:hover {
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.18);
    }

    /* Button Text */
    .btn-text {
      font-weight: 500;
      white-space: nowrap;
      z-index: 5;
    }

    /* Door Scene Inside Button */
    .door-scene {
      position: relative;
      width: 44px;
      height: 38px;
      flex-shrink: 0;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .door-scene svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Doorway opening background */
    .door-btn--dark .doorway {
      fill: #ffffff;
    }
    .door-btn--light .doorway {
      fill: #ffffff;
      stroke: #e2e8f0;
      stroke-width: 1;
    }

    /* Door Leaf (Swiveling Blue Door Panel) */
    .door-leaf {
      transform-origin: 39px 19px;
      transform-style: preserve-3d;
      transform: perspective(90px) rotateY(-46deg);
      transition: transform 0.3s ease;
    }

    .door-panel {
      fill: #2563eb;
    }

    .doorknob {
      fill: #ffffff;
    }

    /* Walking Stickman in Idle State */
    .stickman-walker {
      transform-origin: 13px 20px;
    }

    .sm-head {
      fill: #2563eb;
    }

    .sm-limb {
      stroke: #2563eb;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Door Slam Impact Rays */
    .slam-burst {
      opacity: 0;
      transform-origin: 20px 19px;
      pointer-events: none;
    }
    .door-btn--dark .slam-burst {
      color: #ffffff;
    }
    .door-btn--light .slam-burst {
      color: #2563eb;
    }

    /* ─── Stickman Falling Element (Image 4) ─── */
    .stickman-falling {
      position: absolute;
      right: 24px;
      top: 100%;
      width: 32px;
      height: 36px;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
    }
    .stickman-falling svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ─── ANIMATION SEQUENCE ─── */

    /* 1. Stickman walks into the door */
    .is-animating .stickman-walker {
      animation: stickmanWalkInside 0.5s ease-in forwards;
    }

    @keyframes stickmanWalkInside {
      0% {
        transform: translateX(0);
        opacity: 1;
      }
      35% {
        transform: translateX(5px);
        opacity: 1;
      }
      65% {
        transform: translateX(11px) scale(0.96);
        opacity: 0.95;
      }
      85% {
        transform: translateX(16px) scale(0.88);
        opacity: 0.5;
      }
      100% {
        transform: translateX(19px) scale(0.8);
        opacity: 0;
      }
    }

    .is-animating .sm-arm-front {
      animation: armSwingFront 0.22s ease-in-out infinite alternate;
      transform-origin: 13px 14px;
    }
    .is-animating .sm-arm-back {
      animation: armSwingBack 0.22s ease-in-out infinite alternate;
      transform-origin: 13px 14px;
    }
    .is-animating .sm-leg-front {
      animation: legStrideFront 0.22s ease-in-out infinite alternate;
      transform-origin: 13.5px 21.5px;
    }
    .is-animating .sm-leg-back {
      animation: legStrideBack 0.22s ease-in-out infinite alternate;
      transform-origin: 13.5px 21.5px;
    }

    @keyframes armSwingFront {
      0% { transform: rotate(-30deg); }
      100% { transform: rotate(30deg); }
    }
    @keyframes armSwingBack {
      0% { transform: rotate(30deg); }
      100% { transform: rotate(-30deg); }
    }
    @keyframes legStrideFront {
      0% { transform: rotate(-32deg); }
      100% { transform: rotate(32deg); }
    }
    @keyframes legStrideBack {
      0% { transform: rotate(32deg); }
      100% { transform: rotate(-32deg); }
    }

    /* 2. Door slams shut */
    .is-animating .door-leaf {
      animation: doorSlamShut 0.32s cubic-bezier(0.18, 0.89, 0.32, 1.25) 0.48s forwards;
    }

    @keyframes doorSlamShut {
      0% {
        transform: perspective(90px) rotateY(-46deg);
      }
      65% {
        transform: perspective(90px) rotateY(4deg);
      }
      85% {
        transform: perspective(90px) rotateY(-2deg);
      }
      100% {
        transform: perspective(90px) rotateY(0deg);
      }
    }

    /* 3. Button rumble on slam */
    .is-animating {
      animation: buttonRumble 0.25s ease 0.72s;
    }

    @keyframes buttonRumble {
      0% { transform: translateY(0); }
      25% { transform: translateY(-1.5px) translateX(1px); }
      50% { transform: translateY(1.5px) translateX(-1px); }
      75% { transform: translateY(-0.5px); }
      100% { transform: translateY(0); }
    }

    /* 4. Slam burst impact rays */
    .is-animating .slam-burst {
      animation: slamBurstFlash 0.32s ease-out 0.72s forwards;
    }

    @keyframes slamBurstFlash {
      0% {
        opacity: 0;
        transform: scale(0.6) translateX(3px);
      }
      35% {
        opacity: 1;
        transform: scale(1.1) translateX(0);
      }
      100% {
        opacity: 0;
        transform: scale(1.4) translateX(-3px);
      }
    }

    /* 5. Stickman falls down below the button */
    .is-animating .stickman-falling {
      animation: stickmanTumbleDown 0.85s cubic-bezier(0.55, 0.055, 0.675, 0.19) 0.78s forwards;
    }

    @keyframes stickmanTumbleDown {
      0% {
        opacity: 1;
        transform: translateY(0px) rotate(0deg) scale(0.9);
      }
      20% {
        opacity: 1;
        transform: translateY(14px) rotate(16deg) scale(1);
      }
      50% {
        opacity: 1;
        transform: translateY(38px) rotate(34deg) scale(1.02);
      }
      80% {
        opacity: 0.9;
        transform: translateY(68px) rotate(52deg) scale(0.95);
      }
      100% {
        opacity: 0;
        transform: translateY(96px) rotate(70deg) scale(0.8);
      }
    }
  </style>
</head>
<body>

  <!-- Main Showcase Container -->
  <main class="showcase-container">
    
    <!-- ── DARK THEME CARD ── -->
    <section class="theme-card theme-card--dark">
      <span class="card-label">Dark Theme</span>

      <!-- 1. Dark Theme: Log Out Button -->

        <button class="door-btn door-btn--dark" id="btn-dark-logout" aria-label="Log Out Dark Theme">

              <rect class="doorway" x="25" y="5" width="15" height="28" rx="2" />

                <line x1="22" y1="25" x2="18" y2="29" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </g>
              <!-- Stickman walker -->
              <g class="stickman-walker">

                <line class="sm-limb sm-arm-back" x1="13" y1="14" x2="8.5" y2="18" stroke-width="2" />
                <line class="sm-limb sm-arm-front" x1="13" y1="14" x2="18" y2="16.5" stroke-width="2" />
                <line class="sm-limb sm-leg-back" x1="13.5" y1="21.5" x2="8.5" y2="29.5" stroke-width="2.2" />
                <line class="sm-limb sm-leg-front" x1="13.5" y1="21.5" x2="18" y2="29" stroke-width="2.2" />

          </div>
          <!-- Stickman falling from under the button -->
          <div class="stickman-falling">
            <svg viewBox="0 0 32 36">

              <line x1="21" y1="21" x2="12" y2="13" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />

              <line x1="12" y1="13" x2="5" y2="9" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
              <line x1="12" y1="13" x2="9" y2="5" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </div>
        </button>
      </div>

      <!-- 2. Dark Theme: Log In Button -->
      <div class="button-slot">
        <button class="door-btn door-btn--dark" id="btn-dark-login" aria-label="Log In Dark Theme">
          <span class="btn-text">Log In</span>
          <div class="door-scene">
            <svg viewBox="0 0 46 38">
              <!-- Doorway opening -->
              <rect class="doorway" x="25" y="5" width="15" height="28" rx="2" />
              <!-- Door Leaf (swivels) -->
              <g class="door-leaf">
                <rect class="door-panel" x="25" y="5" width="15" height="28" rx="2" />
                <circle class="doorknob" cx="28" cy="19" r="1.3" />
              </g>
              <!-- Slam burst rays -->
              <g class="slam-burst">
                <line x1="22" y1="13" x2="18" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <line x1="21" y1="19" x2="16" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <line x1="22" y1="25" x2="18" y2="29" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </g>
              <!-- Stickman walker -->
              <g class="stickman-walker">
                <circle class="sm-head" cx="13" cy="9.5" r="3.2" />
                <line class="sm-limb sm-torso" x1="13" y1="13" x2="13.5" y2="21.5" stroke-width="2.2" />
                <line class="sm-limb sm-arm-back" x1="13" y1="14" x2="8.5" y2="18" stroke-width="2" />
                <line class="sm-limb sm-arm-front" x1="13" y1="14" x2="18" y2="16.5" stroke-width="2" />
                <line class="sm-limb sm-leg-back" x1="13.5" y1="21.5" x2="8.5" y2="29.5" stroke-width="2.2" />
                <line class="sm-limb sm-leg-front" x1="13.5" y1="21.5" x2="18" y2="29" stroke-width="2.2" />
              </g>
            </svg>
          </div>
          <!-- Stickman falling from under the button -->
          <div class="stickman-falling">
            <svg viewBox="0 0 32 36">
              <circle cx="23" cy="24" r="3.2" fill="#2563eb" />
              <line x1="21" y1="21" x2="12" y2="13" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
              <line x1="18" y1="18" x2="25" y2="14" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
              <line x1="15" y1="16" x2="10" y2="22" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
              <line x1="12" y1="13" x2="5" y2="9" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
              <line x1="12" y1="13" x2="9" y2="5" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </div>
        </button>
      </div>
    </section>

    <!-- ── LIGHT THEME CARD ── -->
    <section class="theme-card theme-card--light">
      <span class="card-label">Light Theme</span>

      <!-- 3. Light Theme: Log Out Button -->
      <div class="button-slot">
        <button class="door-btn door-btn--light" id="btn-light-logout" aria-label="Log Out Light Theme">
          <span class="btn-text">Log Out</span>
          <div class="door-scene">
            <svg viewBox="0 0 46 38">
              <!-- Doorway opening -->
              <rect class="doorway" x="25" y="5" width="15" height="28" rx="2" />
              <!-- Door Leaf (swivels) -->
              <g class="door-leaf">
                <rect class="door-panel" x="25" y="5" width="15" height="28" rx="2" />
                <circle class="doorknob" cx="28" cy="19" r="1.3" />
              </g>
              <!-- Slam burst rays -->
              <g class="slam-burst">
                <line x1="22" y1="13" x2="18" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <line x1="21" y1="19" x2="16" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />

                <circle class="sm-head" cx="13" cy="9.5" r="3.2" />

                <line class="sm-limb sm-leg-back" x1="13.5" y1="21.5" x2="8.5" y2="29.5" stroke-width="2.2" />
                <line class="sm-limb sm-leg-front" x1="13.5" y1="21.5" x2="18" y2="29" stroke-width="2.2" />
              </g>
            </svg>
          </div>
          <!-- Stickman falling from under the button -->
          <div class="stickman-falling">
            <svg viewBox="0 0 32 36">
              <circle cx="23" cy="24" r="3.2" fill="#2563eb" />
              <line x1="21" y1="21" x2="12" y2="13" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
              <line x1="18" y1="18" x2="25" y2="14" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
              <line x1="15" y1="16" x2="10" y2="22" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
              <line x1="12" y1="13" x2="5" y2="9" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
              <line x1="12" y1="13" x2="9" y2="5" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </div>
        </button>
      </div>

      <!-- 4. Light Theme: Log In Button -->
      <div class="button-slot">
        <button class="door-btn door-btn--light" id="btn-light-login" aria-label="Log In Light Theme">
          <span class="btn-text">Log In</span>
          <div class="door-scene">
            <svg viewBox="0 0 46 38">
              <!-- Doorway opening -->
              <rect class="doorway" x="25" y="5" width="15" height="28" rx="2" />
              <!-- Door Leaf (swivels) -->
              <g class="door-leaf">
                <rect class="door-panel" x="25" y="5" width="15" height="28" rx="2" />
                <circle class="doorknob" cx="28" cy="19" r="1.3" />
              </g>
              <!-- Slam burst rays -->
              <g class="slam-burst">
                <line x1="22" y1="13" x2="18" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <line x1="21" y1="19" x2="16" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <line x1="22" y1="25" x2="18" y2="29" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </g>
              <!-- Stickman walker -->
              <g class="stickman-walker">
                <circle class="sm-head" cx="13" cy="9.5" r="3.2" />
                <line class="sm-limb sm-torso" x1="13" y1="13" x2="13.5" y2="21.5" stroke-width="2.2" />
                <line class="sm-limb sm-arm-back" x1="13" y1="14" x2="8.5" y2="18" stroke-width="2" />
                <line class="sm-limb sm-arm-front" x1="13" y1="14" x2="18" y2="16.5" stroke-width="2" />
                <line class="sm-limb sm-leg-back" x1="13.5" y1="21.5" x2="8.5" y2="29.5" stroke-width="2.2" />
                <line class="sm-limb sm-leg-front" x1="13.5" y1="21.5" x2="18" y2="29" stroke-width="2.2" />
              </g>
            </svg>
          </div>
          <!-- Stickman falling from under the button -->
          <div class="stickman-falling">
            <svg viewBox="0 0 32 36">
              <circle cx="23" cy="24" r="3.2" fill="#2563eb" />
              <line x1="21" y1="21" x2="12" y2="13" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
              <line x1="18" y1="18" x2="25" y2="14" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
              <line x1="15" y1="16" x2="10" y2="22" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
              <line x1="12" y1="13" x2="5" y2="9" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
              <line x1="12" y1="13" x2="9" y2="5" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
            </svg>
          </div>
        </button>
      </div>
    </section>

  </main>

  <script>
    // Trigger animation sequence on button click
    function triggerDoorAnimation(btn) {
      if (btn.classList.contains('is-animating')) return;

      btn.classList.add('is-animating');

      // Auto reset after animation sequence finishes (2.2s)
      setTimeout(() => {
        btn.classList.remove('is-animating');
      }, 2200);
    }

    // Attach click listeners to all 4 buttons
    document.querySelectorAll('.door-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        triggerDoorAnimation(btn);
      });
    });
  </script>
</body>
</html>
