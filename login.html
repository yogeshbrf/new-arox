<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - AROX TECH</title>
  <meta name="description" content="Sign in to your AROX Tech account with sleek cyber eye-tracking authentication." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-viewport">
    <!-- Ambient Red-Orange Atmosphere -->
    <div class="ambient-glow-center" aria-hidden="true"></div>
    <div class="ambient-glow-left" aria-hidden="true"></div>
    <div class="ambient-glow-right" aria-hidden="true"></div>

    <!-- Floating Top Navigation -->
    <header class="auth-topbar">
      <a href="index.html" class="auth-back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>
    </header>

    <!-- Main Auth Interactive Scene -->
    <main class="auth-scene">
      <!-- Left Neon Tracking Eye (Static elevated position) -->
      <aside class="auth-eye-anchor" aria-label="Left tracking eye">
        <div class="auth-eye" id="eye-left">
          <div class="auth-pupil"></div>
        </div>
      </aside>

      <!-- Center Sign In Card -->
      <section class="auth-card">
        <!-- Mobile Eyes (Shown above card on small screens) -->
        <div class="auth-eyes-mobile-row" aria-label="Mobile tracking eyes">
          <div class="auth-eye" id="eye-mobile-left">
            <div class="auth-pupil"></div>
          </div>
          <div class="auth-eye" id="eye-mobile-right">
            <div class="auth-pupil"></div>
          </div>
        </div>

        <div class="auth-card-header">
          <h1 class="auth-card-title">Sign In</h1>
        </div>

        <form class="auth-form auth-form-signin" id="signin-form" autocomplete="on">
          <div class="auth-fields-wrap">
            <!-- Username / Email Field -->
            <div class="auth-field">
              <div class="auth-input-wrapper">
                <input
                  type="text"
                  id="auth-username"
                  name="username"
                  class="auth-input"
                  placeholder="Username or email"
                  required
                  autocomplete="username"
                />
              </div>
            </div>

            <!-- Password Field -->
            <div class="auth-field">
              <div class="auth-input-wrapper">
                <input
                  type="password"
                  id="auth-password"
                  name="password"
                  class="auth-input"
                  placeholder="Password"
                  required
                  autocomplete="current-password"
                />
                <button type="button" class="auth-input-toggle" aria-label="Toggle password visibility">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Utility Row: Remember me & Forgot Password -->
            <div class="auth-row-utils">
              <label class="auth-checkbox-label">
                <input type="checkbox" class="auth-checkbox-input" checked />
                <span class="auth-checkbox-custom">
                  <svg viewBox="0 0 24 24" fill="none">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span>Remember me</span>
              </label>

              <a href="#forgot" class="auth-forgot-link">Forgot Password?</a>
            </div>
          </div>

          <div class="auth-actions-wrap">
            <!-- Sign In Submit Button -->
            <button type="submit" class="auth-submit-btn" id="signin-btn">
              <span>Sign In</span>
            </button>

            <!-- Divider -->
            <div class="auth-divider">
              <span class="auth-divider-line"></span>
              <span class="auth-divider-text">OR</span>
              <span class="auth-divider-line"></span>
            </div>

            <!-- Continue with Google Button -->
            <button type="button" class="auth-social-btn" id="google-signin-btn">
              <svg class="auth-social-icon" viewBox="0 0 24 24" width="18" height="18">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Continue with Google</span>
            </button>

            <!-- Switch to Sign Up -->
            <div class="auth-switch-box">
              <span>Don't have an account?</span>
              <a href="signup.html" class="auth-switch-link">Sign Up</a>
            </div>
          </div>
        </form>
      </section>

      <!-- Right Neon Tracking Eye (Static elevated position) -->
      <aside class="auth-eye-anchor" aria-label="Right tracking eye">
        <div class="auth-eye" id="eye-right">
          <div class="auth-pupil"></div>
        </div>
      </aside>
    </main>

    <!-- Floating Feedback Toast -->
    <div class="auth-toast" id="auth-toast" role="status" aria-live="polite">
      <svg class="auth-toast-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span id="auth-toast-msg">Success</span>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
